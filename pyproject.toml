[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "setmap-audio-profile"
version = "0.1.0"
description = "CPU-first music-set profiling with CLAP embeddings and spherical k-means"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=1.26,<3",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "torch>=2.2,<3",
  "transformers>=4.48,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
setmap-audio = "setmap_audio.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/setmap_audio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
